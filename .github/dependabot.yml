version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Reduce repeated bot branch builds; manually refresh PRs when reviewing them.
    rebase-strategy: disabled
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      next-family:
        patterns:
          - next
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
