version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      next-family:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
    ignore:
      # ESLint 10 is currently incompatible with the eslint-config-next 16.3.8 plugin stack.
      # This rule only pauses major version PRs; revisit after compatibility testing.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
