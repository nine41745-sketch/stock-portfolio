name: Finalize v1.18.0 lockfile

on:
  push:
    branches:
      - feat/scanner-watchlist-lightmode-v1.18.0

permissions:
  contents: write

jobs:
  sync-lockfile-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Sync package-lock release version only
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          lock.version = '1.18.0'
          if (!lock.packages || !lock.packages['']) {
            throw new Error('package-lock root package entry is missing')
          }
          lock.packages[''].version = '1.18.0'
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          NODE

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync v1.18.0 package lock"
          git push
