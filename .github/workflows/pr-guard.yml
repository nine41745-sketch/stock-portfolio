name: PR Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head and base history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test guard rules with synthetic inputs
        run: node --test scripts/test-pr-guard.mjs
      - name: Enforce PR guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GUARD_OVERRIDE_APPROVED: ${{ github.event.action == 'labeled' && github.event.label.name == 'guard-override' && github.actor == github.repository_owner }}
        run: node scripts/qa/check-pr-guard.mjs
