name: Finalize v1.25.1

on:
  push:
    branches:
      - hotfix/v1.25.1
    paths:
      - .github/workflows/finalize-v1251.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/v1.25.1
          fetch-depth: 0

      - name: Finalize release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (pkg.version !== '1.25.0') throw new Error(`Expected package version 1.25.0 before finalization, got ${pkg.version}`)
          pkg.version = '1.25.1'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = '1.25.1'
          lock.packages[''].version = '1.25.1'
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')

          const tsconfig = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'))
          tsconfig.compilerOptions.paths['@/config/changelog'] = ['./config/changelog-v1251']
          fs.writeFileSync('tsconfig.json', JSON.stringify(tsconfig, null, 2) + '\n')

          const criticalPath = 'scripts/test-critical.mjs'
          let critical = fs.readFileSync(criticalPath, 'utf8')
          critical = critical.replace(
            '// v1.25.0 finalized after approved Alerts + Calendar functional Preview smoke.',
            '// v1.25.1 finalized after approved Hotfix functional Preview smoke.'
          )
          critical = critical.replace(
            "assert.equal(packageJson.version, '1.25.0', 'Package version must be finalized as v1.25.0 after Alerts + Calendar Preview smoke')",
            "assert.equal(packageJson.version, '1.25.1', 'Package version must be finalized as v1.25.1 after Hotfix Preview smoke')"
          )
          critical = critical.replace(
            "  ['config/changelog-v125.ts', '2026-09-10 17:53 ICT'],\n]",
            "  ['config/changelog-v125.ts', '2026-09-10 17:53 ICT'],\n  ['config/changelog-v1251.ts', '2026-09-11 00:39 ICT'],\n]"
          )
          critical = critical.replace(
            "assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v125'])",
            "assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v1251'])"
          )
          fs.writeFileSync(criticalPath, critical)

          const alertsTestPath = 'scripts/test-alerts-calendar.mjs'
          let alertsTest = fs.readFileSync(alertsTestPath, 'utf8')
          alertsTest = alertsTest.replace(
            "assert.equal(pkg.version, '1.25.0', 'Functional hotfix Preview must keep Production metadata at v1.25.0 until finalization')",
            "assert.equal(pkg.version, '1.25.1', 'Finalized hotfix candidate must expose v1.25.1 metadata')"
          )
          fs.writeFileSync(alertsTestPath, alertsTest)
          NODE

          cat > config/changelog-v1251.ts <<'EOF'
          import { changelog as previousChangelog } from './changelog-v125'
          import type { ChangelogEntry } from './changelog'

          const v1251: ChangelogEntry = {
            version: 'v1.25.1',
            date: '2026-09-11 00:39 ICT',
            changes: [
              'Performance Oversell Atomicity: ตรวจจำนวนหุ้นใน FIFO lots ให้ครบก่อนประมวลผล SELL เพื่อให้รายการขายเกินจำนวนถูกปฏิเสธโดยไม่กิน lots และไม่เพิ่ม net sells ของรายการที่ไม่สมบูรณ์',
              'Finnhub Rate-limit Hardening: แบ่ง batch การดึง Quote หลายสัญลักษณ์และลด Earnings fan-out โดยใช้ earnings-calendar request ร่วมแล้วกรองเฉพาะหุ้นที่ติดตาม',
              'Regression Coverage: เพิ่มกรณีทดสอบยืนยันว่า oversell ไม่เปลี่ยน FIFO state / realized result และยืนยันพฤติกรรม batch/provider request ของ Alerts + Calendar',
              'Setup Documentation: ปรับ SETUP.md ให้สะท้อน migration ที่ใช้งานจริงถึง Watchlist v1.18.0, Transactions v1.21.0 และ Trade Plan v1.23.0 โดยไม่สั่ง rerun migration เดิม',
              'Versioning Documentation: ปรับ VERSIONING.md ให้ตรงกับ repo ปัจจุบันว่า package-lock.json ถูก track และต้อง sync version คู่กับ package.json ใน release',
              'Safety: Hotfix ไม่มี Supabase Migration/SQL ใหม่ ไม่มีการแก้ Holdings, Transactions หรือ Trade Plan อัตโนมัติ และคงพฤติกรรมหลักของ v1.25.0 ไว้เดิม',
            ],
          }

          export const changelog: ChangelogEntry[] = [v1251, ...previousChangelog]
          export const CURRENT_VERSION = changelog[0]?.version ?? 'v1.0.0'
          EOF

      - name: Verify finalized candidate
        run: |
          npm ci
          npm run ci

      - name: Commit finalized candidate and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v1251.yml
          git add package.json package-lock.json tsconfig.json scripts/test-critical.mjs scripts/test-alerts-calendar.mjs config/changelog-v1251.ts
          git commit -m "chore: finalize v1.25.1 hotfix release candidate"
          git push origin HEAD:hotfix/v1.25.1
