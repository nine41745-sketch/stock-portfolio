name: Create v1.20.0 tag

on:
  push:
    branches:
      - feat/stock-check-v1.20.0

permissions:
  contents: write

jobs:
  create-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Production commit and create tag
        run: |
          set -euo pipefail
          TARGET_SHA="1695783df50731dbacf7932e4dc513728291017e"
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "Refusing to tag: origin/main=$MAIN_SHA expected=$TARGET_SHA"
            exit 1
          fi
          if git show-ref --verify --quiet refs/tags/v1.20.0; then
            echo "Refusing to overwrite existing tag v1.20.0"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.20.0 "$TARGET_SHA" -m "v1.20.0 — Stock Check workspace"
          git push origin refs/tags/v1.20.0
