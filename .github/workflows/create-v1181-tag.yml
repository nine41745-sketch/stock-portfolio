name: Create v1.18.1 tag

on:
  push:
    branches:
      - fix/changelog-time-v1.18.1

permissions:
  contents: write

jobs:
  create-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated production tag
        env:
          TARGET_SHA: fe92b94a9620ce62df5508537a36165bd6673d0c
          TAG_NAME: v1.18.1
        run: |
          set -euo pipefail
          git fetch origin main --tags
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
            echo "main moved: expected $TARGET_SHA, got $CURRENT_MAIN"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; refusing to overwrite"
            exit 1
          fi

          git config user.name "nine41745-sketch"
          git config user.email "nine41745@gmail.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "v1.18.1 — changelog release-time hotfix"
          git push origin "refs/tags/$TAG_NAME"
