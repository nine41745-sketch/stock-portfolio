name: Fix v1.19.0 theme persistence

on:
  push:
    branches:
      - feat/scanner-page-v1.19.0

permissions:
  contents: write

jobs:
  fix-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch theme persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dashboard_path = Path('components/portfolio/PortfolioDashboard.tsx')
          dashboard = dashboard_path.read_text()

          state_anchor = "  const [darkMode, setDarkMode] = useState(true)\n"
          if state_anchor not in dashboard:
              raise SystemExit('darkMode state anchor not found')
          dashboard = dashboard.replace(
              state_anchor,
              state_anchor + "  const [themeReady, setThemeReady] = useState(false)\n",
              1,
          )

          effect_pattern = re.compile(
              r"\s*// apply theme ที่ <html> ให้ครอบทั้งหน้า\n"
              r"\s*useEffect\(\(\) => \{\n"
              r"\s*document\.documentElement\.setAttribute\('data-theme', darkMode \? 'dark' : 'light'\)\n"
              r"\s*\}, \[darkMode\]\)"
          )
          new_effect = """

          // Sync state กับ theme ที่ root bootstrap คืนค่าจาก browser preference ก่อน hydration
          useEffect(() => {
            const currentTheme = document.documentElement.getAttribute('data-theme')
            setDarkMode(currentTheme !== 'light')
            setThemeReady(true)
          }, [])

          // apply + persist theme ที่ <html> ให้ครอบทั้ง Dashboard และ Scanner หลัง user เปลี่ยนค่า
          useEffect(() => {
            if (!themeReady) return
            const theme = darkMode ? 'dark' : 'light'
            document.documentElement.setAttribute('data-theme', theme)
            try { window.localStorage.setItem('stock-portfolio-theme', theme) } catch { /* storage unavailable */ }
          }, [darkMode, themeReady])
          """
          dashboard, count = effect_pattern.subn(new_effect.rstrip(), dashboard, count=1)
          if count != 1:
              raise SystemExit(f'theme effect replacement count={count}')
          dashboard_path.write_text(dashboard)

          layout_path = Path('app/layout.tsx')
          layout = layout_path.read_text()
          import_anchor = "import type { Metadata } from 'next'\n"
          if "import Script from 'next/script'" not in layout:
              if import_anchor not in layout:
                  raise SystemExit('layout import anchor not found')
              layout = layout.replace(import_anchor, import_anchor + "import Script from 'next/script'\n", 1)

          default_anchor = "export default function RootLayout({\n"
          init_block = """const THEME_INIT_SCRIPT = `
          (() => {
            try {
              const saved = window.localStorage.getItem('stock-portfolio-theme')
              document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark')
            } catch {
              document.documentElement.setAttribute('data-theme', 'dark')
            }
          })()
          `

          """
          if "const THEME_INIT_SCRIPT" not in layout:
              if default_anchor not in layout:
                  raise SystemExit('layout RootLayout anchor not found')
              layout = layout.replace(default_anchor, init_block + default_anchor, 1)

          html_anchor = '<html lang="th">'
          if html_anchor not in layout:
              raise SystemExit('html anchor not found')
          layout = layout.replace(html_anchor, '<html lang="th" suppressHydrationWarning>', 1)

          guard_anchor = "        <UserSettingsMutationGuard />\n"
          script_block = """        <Script
                    id="theme-preference-init"
                    strategy="beforeInteractive"
                    dangerouslySetInnerHTML={{ __html: THEME_INIT_SCRIPT }}
                  />
          """
          if "theme-preference-init" not in layout:
              if guard_anchor not in layout:
                  raise SystemExit('layout guard anchor not found')
              layout = layout.replace(guard_anchor, script_block + guard_anchor, 1)
          layout_path.write_text(layout)

          test_path = Path('scripts/test-critical.mjs')
          tests = test_path.read_text()
          anchor = "const dashboardSource = fs.readFileSync('components/portfolio/PortfolioDashboard.tsx', 'utf8')\n"
          additions = """const dashboardSource = fs.readFileSync('components/portfolio/PortfolioDashboard.tsx', 'utf8')
          assert.match(dashboardSource, /stock-portfolio-theme/, 'Dashboard theme toggle must persist the selected theme')
          assert.match(dashboardSource, /localStorage\\.setItem/, 'Dashboard theme toggle must write browser preference')
          const rootLayoutSource = fs.readFileSync('app/layout.tsx', 'utf8')
          assert.match(rootLayoutSource, /localStorage\\.getItem\\('stock-portfolio-theme'\\)/, 'Root layout must restore the saved theme before page interaction')
          assert.match(rootLayoutSource, /beforeInteractive/, 'Saved theme must be restored before hydration to avoid dark-mode reset/flash')
          """
          if "Dashboard theme toggle must persist the selected theme" not in tests:
              if anchor not in tests:
                  raise SystemExit('critical-test anchor not found')
              tests = tests.replace(anchor, additions, 1)
          test_path.write_text(tests)
          PY

      - name: Verify patch
        run: |
          npm ci
          npm run ci

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx components/portfolio/PortfolioDashboard.tsx scripts/test-critical.mjs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: persist light and dark theme across refresh"
          git push origin HEAD:feat/scanner-page-v1.19.0
