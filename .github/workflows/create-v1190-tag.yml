name: Create v1.19.0 tag

on:
  push:
    branches:
      - feat/scanner-page-v1.19.0

permissions:
  contents: write

jobs:
  create-tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Production commit and create tag
        run: |
          set -euo pipefail
          TARGET_SHA="8ee94b21c8ac632cec0215d5764fcfd386dafd56"
          git fetch origin main --tags --force
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "Refusing tag: origin/main is $MAIN_SHA, expected $TARGET_SHA"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v1.19.0" >/dev/null; then
            echo "Refusing overwrite: v1.19.0 already exists"
            exit 1
          fi
          git config user.name "nine41745-sketch"
          git config user.email "nine41745@gmail.com"
          git tag -a v1.19.0 "$TARGET_SHA" -m "v1.19.0 — dedicated scanner workspace"
          git push origin refs/tags/v1.19.0
