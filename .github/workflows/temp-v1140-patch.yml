name: Temporary v1.14.0 targeted patch

on:
  push:
    branches:
      - feat/portfolio-guidance-v1.14.0

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-guidance-v1.14.0
          fetch-depth: 0

      - name: Apply exact scoped edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {found}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          # (4) ให้ "แก้ไขล่าสุด" เปลี่ยนทันทีใน optimistic state หลังบันทึกสำเร็จ
          replace_exact(
              'components/portfolio/PortfolioDashboard.tsx',
              'week52Low: nm.week52Low ?? null } : h)',
              'week52Low: nm.week52Low ?? null, updated_at: new Date().toISOString() } : h)',
          )
          replace_exact(
              'components/portfolio/PortfolioDashboard.tsx',
              'return { ...h, shares: payload.shares, cost_basis: payload.cost_basis ?? null, notes: payload.notes, market_value: mv, total_cost: tc, pnl, pnl_pct }',
              'return { ...h, shares: payload.shares, cost_basis: payload.cost_basis ?? null, notes: payload.notes, market_value: mv, total_cost: tc, pnl, pnl_pct, updated_at: new Date().toISOString() }',
          )

          # (2) Manual AI: บังคับ sizing เป็น % ของจำนวนหุ้นที่ถือ และจำกัดเป็น step ที่กำหนด
          manual_anchor = 'ห้ามเลือก BUY แค่เพราะมีเงินสดเหลือเยอะ ต้องมีเหตุผลด้านเทคนิคัล/ข่าว/fundamentals รองรับเสมอ (HOLD เลือกได้เฉพาะเมื่อเช็กครบทุกข้อแล้วไม่เข้าเงื่อนไขใดเลยจริงๆ ตามที่อธิบายในข้อ 4)'
          manual_sizing = '''=== Position Sizing — คิดจากจำนวนหุ้นที่ถือปัจจุบัน ===
- เปอร์เซ็นต์ทั้งหมดต้องคิดจาก shares ปัจจุบันของหุ้นตัวนี้ (ไม่ใช่ % ของเงินสดหรือมูลค่าพอร์ต)
- ถ้า action = BUY และ shares > 0: เลือกได้เพียง 5%, 10%, 15%, 20%, 25%, 33% หรือ 50% เท่านั้น แล้วขึ้นต้น buyConditions ด้วยรูปแบบ "ช้อนเพิ่ม X% (~Y หุ้น) — ..." โดย Y = shares × X/100 (ปัดไม่เกิน 4 ตำแหน่ง) ต้องคำนึงเงินสดและ concentration risk; ห้ามแนะนำจำนวนที่ใช้เงินเกินเงินสดที่มี ถ้าเงินสดไม่พอแม้แต่ 5% ให้เปลี่ยนเป็น HOLD
- ถ้า action = SELL_PARTIAL: เลือกได้เพียง 5%, 10%, 15%, 20%, 25%, 33% หรือ 50% เท่านั้น แล้วขึ้นต้น sellConditions ด้วย "ขายทำกำไร X% (~Y หุ้น) — ..." โดย Y = shares × X/100 (ปัดไม่เกิน 4 ตำแหน่ง)
- ถ้า action = HOLD: ให้ถือว่า 0% ไม่ต้องแนะนำซื้อ/ขาย; ถ้า action = SELL_ALL: sellConditions ต้องขึ้นต้น "ขายทั้งหมด 100% (~Y หุ้น) — ..." โดย Y = shares ทั้งหมด
- ถ้า shares = 0 ห้ามแต่งจำนวนหุ้นจากศูนย์เอง ให้ระบุใน buyConditions ว่าไม่สามารถคำนวณ sizing แบบ % ของจำนวนหุ้นที่ถือได้
- ห้ามใช้เปอร์เซ็นต์นอกชุดที่กำหนด และห้ามคำนวณ Y จาก cost/value แทน shares'''
          replace_exact('lib/groq.ts', manual_anchor, manual_sizing + '\n\n' + manual_anchor)

          # (2) Daily Portfolio Batch: sizing แบบเดียวกับ manual แต่จัดสรรเงินสดในบริบทพอร์ตทั้งก้อน
          batch_anchor = 'แยกข่าว company-specific กับ macro/sector; P/E เป็น trailing/normalized และไม่มี freshness timestamp; ห้ามเดาราคา/forward P/E'
          batch_sizing = '''กติกา Position Sizing (สำคัญ):
- % ทุกตัวคิดจาก sh (จำนวนหุ้นที่ถือปัจจุบัน) ของหุ้นนั้น ไม่ใช่ % ของเงินสด/มูลค่าพอร์ต และเลือกได้เฉพาะ 5,10,15,20,25,33,50 (SELL_ALL = 100, HOLD = 0)
- BUY: bc ต้องขึ้นต้น "ช้อนเพิ่ม X% (~Y หุ้น) —" โดย Y=sh*X/100; ต้องคำนึง concentration และ cash ก้อนเดียวของทั้งพอร์ต ห้ามแนะนำ BUY หลายตัวโดยใช้เงินสดก้อนเดิมซ้ำจนยอดซื้อรวมเกิน cash; ถ้าเงินไม่พอ 5% ให้ HOLD
- SELL_PARTIAL: sc ต้องขึ้นต้น "ขายทำกำไร X% (~Y หุ้น) —" โดย Y=sh*X/100; SELL_ALL: sc ขึ้นต้น "ขายทั้งหมด 100% (~Y หุ้น) —"; ปัด Y ไม่เกิน 4 ตำแหน่ง
- ถ้า sh=0 ห้ามแต่งจำนวนหุ้นจากศูนย์เอง ให้ระบุว่า sizing แบบ % ของจำนวนหุ้นที่ถือคำนวณไม่ได้'''
          replace_exact('lib/portfolio-batch.ts', batch_anchor, batch_sizing + '\n\n' + batch_anchor)

          # workflow นี้มีไว้ patch ครั้งเดียวเท่านั้น — ลบตัวเองก่อน commit ปลายทาง
          Path('.github/workflows/temp-v1140-patch.yml').unlink()
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "nine41745-sketch"
          git config user.email "nine41745@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add portfolio sizing and PIN-only inactivity lock [auto-patch-done]"
          git push origin HEAD:feat/portfolio-guidance-v1.14.0
