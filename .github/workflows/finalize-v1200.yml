name: Finalize v1.20.0 metadata

on:
  push:
    branches:
      - feat/stock-check-v1.20.0

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Finalize v1.20.0 metadata
        run: |
          npm version 1.20.0 --no-git-tag-version
          export RELEASE_TIME="$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M ICT')"
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('tsconfig.json')
          data = json.loads(p.read_text())
          data['compilerOptions']['paths']['@/config/changelog'] = ['./config/changelog-v120']
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          release_time = os.environ['RELEASE_TIME']
          Path('config/changelog-v120.ts').write_text(f"""import {{ changelog as previousChangelog }} from './changelog-v119'\nimport type {{ ChangelogEntry }} from './changelog'\n\nconst v1200: ChangelogEntry = {{\n  version: 'v1.20.0',\n  date: '{release_time}',\n  changes: [\n    'Stock Check: เพิ่มแท็บเช็กหุ้นรายตัวใน Scanner เพื่อวิเคราะห์หุ้น US ใดก็ได้โดยไม่ต้องเพิ่มเข้า Portfolio ก่อน',\n    'Deterministic Trade Plan: เพิ่ม BUY NOW / BUY ON PULLBACK / WAIT FOR BREAKOUT / WATCH / AVOID พร้อม Entry Zone, Stop Loss, Target 1/2 และ Risk:Reward',\n    'Risk Planning: เพิ่ม ATR14 แบบแยกจาก Portfolio AI เพื่อช่วยวาง Stop ตาม volatility พร้อม Position Sizing จากงบที่กำหนด',\n    'Market Context: ใช้แนวรับ/แนวต้านและ Volume แบบ scanner-safe, Relative Strength เทียบ SPY, P/E, 52W range และ Earnings Risk',\n    'Optional AI: เพิ่มการวิเคราะห์เชิงลึกด้วย AI เป็นขั้นเสริม โดยไม่ให้ AI เปลี่ยนระดับราคาและคำตัดสิน deterministic',\n    'Data Safety: ไม่มี SQL migration ใหม่ ไม่แก้ Holdings และไม่เปลี่ยน logic AI/Track Record/Daily Cron เดิมของ Portfolio',\n  ],\n}}\n\nexport const changelog: ChangelogEntry[] = [v1200, ...previousChangelog]\nexport const CURRENT_VERSION = changelog[0]?.version ?? 'v1.0.0'\n""")

          p = Path('scripts/test-critical.mjs')
          s = p.read_text()
          s = s.replace('// v1.19.0 finalized after approved Preview smoke.', '// v1.20.0 finalized after approved Stock Check Preview smoke.', 1)
          s = s.replace("assert.equal(packageJson.version, '1.19.0', 'Package version must be finalized as v1.19.0 after Preview smoke')", "assert.equal(packageJson.version, '1.20.0', 'Package version must be finalized as v1.20.0 after Preview smoke')", 1)
          s = s.replace("  ['config/changelog-v119.ts', '2026-09-09 23:10 ICT'],\n]", f"  ['config/changelog-v119.ts', '2026-09-09 23:10 ICT'],\n  ['config/changelog-v120.ts', '{release_time}'],\n]", 1)
          s = s.replace("assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v119'])", "assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v120'])", 1)
          p.write_text(s)
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Critical regression tests
        run: npm run test:critical

      - name: Commit finalized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tsconfig.json config/changelog-v120.ts scripts/test-critical.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize v1.20.0 release metadata"
          git push origin HEAD:feat/stock-check-v1.20.0
