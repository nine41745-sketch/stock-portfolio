name: Finalize v1.21.0

on:
  push:
    branches:
      - feat/transactions-ledger-v1.21.0
    paths:
      - .github/workflows/finalize-v1210.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/transactions-ledger-v1.21.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Finalize v1.21.0 metadata
        shell: bash
        run: |
          npm version 1.21.0 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs')

          const changelog = `import { changelog as previousChangelog } from './changelog-v120'\nimport type { ChangelogEntry } from './changelog'\n\nconst v1210: ChangelogEntry = {\n  version: 'v1.21.0',\n  date: '2026-09-10 02:16 ICT',\n  changes: [\n    'Transaction Ledger: เพิ่มเมนูธุรกรรมสำหรับ BUY / SELL / ยอดหุ้นตั้งต้น / ปันผล / ฝากเงิน / ถอนเงิน พร้อมเพิ่ม แก้ไข ลบ และตัวกรอง',\n    'Holdings Reconciliation: เพิ่มการตรวจเทียบ Opening + BUY - SELL กับจำนวนหุ้นใน Holdings โดยไม่แก้ Holdings อัตโนมัติ',\n    'Existing Portfolio Adoption: เพิ่ม OPENING_POSITION เพื่อรับยอดหุ้นเดิมเข้าระบบโดยไม่ต้องสร้างประวัติซื้อย้อนหลังปลอม',\n    'Encrypted Ledger: ราคา ค่าธรรมเนียม และจำนวนเงินถูกเข้ารหัสด้วย pgcrypto และอ่าน/เขียนผ่าน service-role-only RPC',\n    'Database Security: เพิ่ม portfolio_transactions, RLS, constraint, indexes และจำกัดสิทธิ์ RPC/ตารางสำหรับ browser',\n    'Regression Safety: เพิ่ม Transaction Ledger regression gate และยืนยันว่า Holdings, cost basis, cash balance, Daily Cron, Portfolio AI และ Track Record เดิมไม่ถูกแก้โดย Ledger',\n  ],\n}\n\nexport const changelog: ChangelogEntry[] = [v1210, ...previousChangelog]\nexport const CURRENT_VERSION = changelog[0]?.version ?? 'v1.0.0'\n`
          fs.writeFileSync('config/changelog-v121.ts', changelog)

          const tsconfig = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'))
          tsconfig.compilerOptions.paths['@/config/changelog'] = ['./config/changelog-v121']
          fs.writeFileSync('tsconfig.json', JSON.stringify(tsconfig, null, 2) + '\n')

          const criticalPath = 'scripts/test-critical.mjs'
          let critical = fs.readFileSync(criticalPath, 'utf8')
          critical = critical.replace('// v1.20.0 finalized after approved Stock Check Preview smoke.', '// v1.21.0 finalized after approved Transaction Ledger Preview smoke.')
          critical = critical.replace("assert.equal(packageJson.version, '1.20.0', 'Package version must be finalized as v1.20.0 after Preview smoke')", "assert.equal(packageJson.version, '1.21.0', 'Package version must be finalized as v1.21.0 after Preview smoke')")
          critical = critical.replace("  ['config/changelog-v120.ts', '2026-09-10 00:48 ICT'],\n]", "  ['config/changelog-v120.ts', '2026-09-10 00:48 ICT'],\n  ['config/changelog-v121.ts', '2026-09-10 02:16 ICT'],\n]")
          critical = critical.replace("assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v120'])", "assert.deepEqual(tsconfig.compilerOptions?.paths?.['@/config/changelog'], ['./config/changelog-v121'])")
          fs.writeFileSync(criticalPath, critical)

          const transactionPath = 'scripts/test-transactions.mjs'
          let transactions = fs.readFileSync(transactionPath, 'utf8')
          transactions = transactions.replace("assert.equal(pkg.version, '1.20.0', 'Preview implementation must not finalize v1.21.0 before smoke testing')", "assert.equal(pkg.version, '1.21.0', 'Transaction Ledger package version must be finalized after approved Preview smoke')")
          fs.writeFileSync(transactionPath, transactions)
          NODE

      - name: Verify finalized Preview release
        run: npm run ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          SUPABASE_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-bytes-minimum
          FINNHUB_API_KEY: ci-placeholder-finnhub
          GROQ_API_KEY: ci-placeholder-groq
          CRON_SECRET: ci-placeholder-cron-secret
          PIN_PEPPER: ci-placeholder-pin-pepper
          PIN_SESSION_SECRET: ci-placeholder-pin-session-secret-at-least-32-bytes

      - name: Commit finalized metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tsconfig.json scripts/test-critical.mjs scripts/test-transactions.mjs config/changelog-v121.ts
          git commit -m "chore: finalize v1.21.0 release metadata"
          git push origin HEAD:feat/transactions-ledger-v1.21.0
